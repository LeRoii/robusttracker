# 可见光模型
engine: /home/rpdzkj/robusttracker/model/rgb_yolov8_s.rknn
# 红外模型
# irengine: /home/rpdzkj/code/robusttracker-0229/self_v0/model/yolox_RK3588_i8-ir.rknn
irengine: /home/rpdzkj/robusttracker/model/ir_yolov8.rknn
# 波门大小
gateSize: 28
# 可见光模型类别
visClsNum: 10
# 红外模型类别
irClsNum: 3
# 脱靶量限制初值
initalOffsetLimit: 100
# 脱靶量限制最大值
offsetLimitCeil: 150
# 跟踪器失败次数阈值
strackerFailCntThres: 2
# 跟踪器搜索帧数阈值
ssearchCntThres: 100
# 脱靶量递增量
offsetLimitIncCntThres: 10
# 跟踪目标轨迹长度
trackTraceSizeThres: 90
# 决定速度更新的跟踪框面积差阈值
trackVeloUpdateSizeDifThres: 4
# 速度历史数据长度
trackVeloBufSize: 30
# 可见光识别模型nms阈值
detectorVisNmsConf: 0.45
# 可见光识别模型置信度阈值
detectorVisConf: 0.4
# 红外识别模型nms阈值
detectorIrNmsConf: 0.45
# 红外识别模型置信度阈值
detectorIrConf: 0.2
# 识别结果二次nms阈值
detectorBoxDifThres: 5

######结合识别做跟踪的参数
# 目标最长丢失帧数
trackFinalLostCntThres: 120
# 初始化识别融合距离
initFusMinDistThres: 70
# 识别融合距离初值
initialMinDistThres: 15.0
# 识别融合识别框面积差阈值
initialAreaDifThres: 30.0
# search状态持续帧数
searchFrameCntThres: 3
# 目标状态更新相似度阈值
trackUpdateSimThres: 0.7
# 计算图像特征次数阈值
featureCalCntThres: 3
# 图像特征距离阈值
featureAbanDistThres: 100
# 识别结果匹配最小距离
minDistCeil: 40
# 识别结果匹配缩放次数
minDistThresScalCnt: 3
# 识别框面积差最大值
areaDifThresCeil: 50
# 图像特征切换阈值
maxSimThresFSwitch: 0.65
# 图像特征插值切换阈值
maxSimDifThresFSwitch: 0.3
# stracker重置前的等待帧数
strackerWaitThres: 5
# stracker与识别结果不一致的帧数阈值，超过次阈值则重置stracker
containRectCntThres: 3
# 识别结果匹配失败阈值
dtrackerLostCntThres: 2